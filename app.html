*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}

const $ = (s, el=document) => el.querySelector(s);

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* ===================================================================
   MESIN HITUNG
   =================================================================== */
const RP = (()=>{

  /* Cicilan anuitas: P pokok, i bunga tahunan (desimal), n bulan */
  function annuity(P,i,n){ if(n<=0) return 0; const r=i/12; return r===0? P/n : P*r/(1-Math.pow(1+r,-n)); }

  /* Jadwal KPR dengan bunga tetap selama `fixY` tahun lalu bunga mengambang `iFloat` (anuitas dihitung ulang atas sisa pokok) */
  function kpr({price,dpPct,i,years,fixY=0,iFloat=null,subsidy=0}){
    const down=Math.max(0,price*dpPct-subsidy), P=Math.max(0,price-price*dpPct), n=Math.round(years*12);
    let bal=P, rows=[], totI=0, pay=0, firstPay=0, laterPay=null;
    const fixN = (iFloat==null||fixY<=0)? n : Math.min(n,Math.round(fixY*12));
    for(let m=1;m<=n;m++){
      const rate = m<=fixN? i : iFloat;
      if(m===1||m===fixN+1) pay = annuity(bal, rate, n-m+1);
      if(m===1) firstPay=pay; if(m===fixN+1) laterPay=pay;
      const int=bal*rate/12, prin=Math.min(bal,pay-int); bal-=prin; totI+=int;
      if(m%12===0||m===n) rows.push({year:Math.ceil(m/12), bal:Math.max(0,bal), totI});
    }
    return {down, principal:P, n, firstPay, laterPay, totalInterest:totI, totalPaid:P+totI, rows};
  }

  /* NPV arus kas bulanan dengan tingkat diskonto tahunan efektif */
  function npv(flows, annualRate){ const r=Math.pow(1+annualRate,1/12)-1; return flows.reduce((a,f,t)=>a+f/Math.pow(1+r,t),0); }
  /* IRR bulanan (bisection pada NPV) → dikembalikan tahunan efektif */
  function irr(flows){
    const f=r=>flows.reduce((a,v,t)=>a+v/Math.pow(1+r,t),0);
    if(!flows.some(v=>v<0)||!flows.some(v=>v>0)) return NaN;
    let lo=-0.99, hi=1, flo=f(lo), fhi=f(hi), k=0;
    while(flo*fhi>0 && k<60){ hi*=2; fhi=f(hi); k++; } if(flo*fhi>0) return NaN;
    for(let it=0;it<200;it++){ const mid=(lo+hi)/2, fm=f(mid); if(Math.abs(fm)<1e-7){lo=hi=mid;break} if(flo*fm<0){hi=mid;fhi=fm}else{lo=mid;flo=fm} }
    const m=(lo+hi)/2; return Math.pow(1+m,12)-1;
  }
  const irrMonthly = flows => { const a=irr(flows); return isFinite(a)? Math.pow(1+a,1/12)-1 : NaN; };

  /* -------- Tata letak tapak --------
     Lahan persegi panjang W (lebar, sumbu x) × D (panjang/kedalaman, sumbu y), pintu masuk di y=0.
     Lajur depan: RTH + fasum + makam (bila ada). Lalu blok: jalan lingkungan, 2 deret kavling saling membelakangi, jalan, ...
     Jalan utama membujur (sumbu y) di tengah atau di tepi kiri. */
  function layout(p, types){
    const W=+p.W, D=+p.D, A=W*D, mainW=+p.mainW, lw=+p.localW, spine=p.spine||'tengah';
    const out={W,D,A,roads:[],lots:[],rth:[],fasum:[],makam:[],sisa:[],kom:[],ruko:[],blocks:[],warn:[]};
    if(!(W>0&&D>0)) { out.warn.push('Ukuran lahan belum diisi.'); return finish(out,p); }
    // zona komersial (ruko/kavling komersial) menghadap jalan akses di muka kawasan
    let yk=0; { const kp=+p.komPct||0, sx0=spine==='tengah'? (W-mainW)/2 : 0, sk=spine==='tengah'? [[0,sx0],[sx0+mainW,W]] : [[mainW,W]], us=sk.reduce((a,q)=>a+q[1]-q[0],0), rw=Math.max(3,+p.rukoW||5);
      if(kp>0&&us>0){ const kd=clamp(A*kp/100/us,8,D*.3); for(const q of sk){ const L=q[1]-q[0]; if(L<rw) continue; out.kom.push({x:q[0],y:0,w:L,h:kd}); const n=Math.floor(L/rw+1e-6); for(let i=0;i<n;i++) out.ruko.push({x:q[0]+i*rw,y:0,w:rw,h:kd}); const rem=L-n*rw; if(rem>.01) out.ruko.push({x:q[0]+n*rw,y:0,w:rem,h:kd,sisa:true}); } yk=kd; } }
    // lajur depan
    const front = A*((+p.rthPct||0)+(+p.fasumPct||0)+(+p.makamPct||0))/100;
    let fd = Math.min(D*0.6, front/W);
        const parts=[['fasum',+p.fasumPct||0],['rth',+p.rthPct||0],['makam',+p.makamPct||0]].filter(q=>q[1]>0), tot=parts.reduce((a,q)=>a+q[1],0)||1;
    // jalan utama memotong lajur depan sebagai jalan masuk
    const sx = spine==='tengah'? (W-mainW)/2 : 0;
    if(fd>0){
      // bagi lebar lajur depan (dikurangi jalan masuk) sebanding porsi
      const segs = spine==='tengah'? [[0,sx],[sx+mainW,W]] : [[mainW,W]];
      const usable = segs.reduce((a,s)=>a+(s[1]-s[0]),0);
      fd = Math.min((D-yk)*0.6, front/Math.max(1,usable));
      let need = parts.map(q=>[q[0], usable*q[1]/tot]);
      for(const s of segs){ let cx=s[0]; while(cx < s[1]-1e-6 && need.length){ const q=need[0]; const take=Math.min(q[1], s[1]-cx); out[q[0]].push({x:cx,y:yk,w:take,h:fd}); cx+=take; q[1]-=take; if(q[1]<=1e-6) need.shift(); } }
    }
    const y0 = yk+fd;
    // jalan utama
    out.roads.push({x:sx,y:0,w:mainW,h:D,kind:'utama'});
    // panjang segmen deret
    const segs = spine==='tengah'? [[0,sx],[sx+mainW,W]] : [[mainW,W]];
    // blok berulang ke arah y
    const shares = types.map(t=>Math.max(0,+t.share||0)); const sumShare = shares.reduce((a,b)=>a+b,0)||1;
    const made = types.map(()=>0);
    let y = y0, guard=0;
    while(guard++<500){
      // jalan lingkungan
      if(y+lw > D) break;
      out.roads.push({x:0,y,w:W,h:lw,kind:'lingkungan'}); y+=lw;
      // pilih tipe dengan kekurangan terbesar terhadap porsinya
      const totalMade = made.reduce((a,b)=>a+b,0)||0;
      let best=-1, bestGap=-Infinity;
      types.forEach((t,i)=>{ if(!(+t.lotW>0&&+t.lotD>0)||shares[i]<=0) return; const target=shares[i]/sumShare; const have=totalMade? made[i]/totalMade : 0; const gap=target-have; if(gap>bestGap){bestGap=gap;best=i} });
      if(best<0){ out.warn.push('Belum ada tipe rumah dengan ukuran kavling & porsi > 0.'); break; }
      const t=types[best], ld=+t.lotD, lwid=+t.lotW;
      const room = D - y;
      const rows = room >= 2*ld + lw ? 2 : (room >= 2*ld ? 2 : room >= ld ? 1 : 0);
      if(rows===0){ break; }
      const blk={y,h:rows*ld,type:best,rows};
      for(let r=0;r<rows;r++){
        const ry = y + r*ld;
        for(const s of segs){
          const L=s[1]-s[0], n=Math.floor((L+1e-6)/lwid);
          for(let k=0;k<n;k++) out.lots.push({x:s[0]+k*lwid,y:ry,w:lwid,h:ld,type:best,face:r===0?'atas':'bawah'});
          const rem = L - n*lwid; if(rem>0.01) out.sisa.push({x:s[0]+n*lwid,y:ry,w:rem,h:ld});
          made[best]+=n;
        }
      }
      out.blocks.push(blk); y += rows*ld;
    }
    if(y < D-0.01) segs.forEach(q=>out.sisa.push({x:q[0],y,w:q[1]-q[0],h:D-y,end:true})); /* tanpa menumpuk jalan utama */
    return finish(out,p);
  }
  function areaOf(arr){ return arr.reduce((a,r)=>a+r.w*r.h,0); }
  function finish(o,p){
    // luas jalan: jalan utama + jalan lingkungan − tumpang tindih
    const main=o.roads.filter(r=>r.kind==='utama'), loc=o.roads.filter(r=>r.kind==='lingkungan');
    let overlap=0; main.forEach(m=>loc.forEach(l=>{ const ox=Math.max(0,Math.min(m.x+m.w,l.x+l.w)-Math.max(m.x,l.x)), oy=Math.max(0,Math.min(m.y+m.h,l.y+l.h)-Math.max(m.y,l.y)); overlap+=ox*oy; }));
    // jalan utama yang melewati lajur depan tetap dihitung jalan
    // jalan utama di area blok: deret kavling tidak menempati jalur jalan utama, jadi luas = W×D kurang yang lain
    const aRoad = areaOf(main)+areaOf(loc)-overlap;
    const aLot = areaOf(o.lots), aRth=areaOf(o.rth), aFas=areaOf(o.fasum), aMak=areaOf(o.makam), aSisa=areaOf(o.sisa), aKom=areaOf(o.kom||[]);
    // jalan utama yang melintas zona komersial tidak dihitung dua kali
    const aKomRoad = (o.kom||[]).length&&main.length? 0 : 0;
    const aPsu = aRoad+aRth+aFas+aMak+aSisa;
    o.area={road:aRoad,lot:aLot,rth:aRth,fasum:aFas,makam:aMak,sisa:aSisa,kom:aKom,psu:aPsu,sum:aRoad+aLot+aRth+aFas+aMak+aSisa+aKom+aKomRoad};
    o.units=o.lots.length;
    o.share={lot:aLot/o.A, psu:aPsu/o.A, road:aRoad/o.A, rth:(aRth+aSisa)/o.A, fasum:aFas/o.A, makam:aMak/o.A};
    o.density = o.units/(o.A/1e4);
    // panjang jalan (untuk saluran): sumbu terpanjang tiap ruas
    o.roadLen = main.reduce((a,r)=>a+r.h,0) + loc.reduce((a,r)=>a+r.w,0) - loc.length*main.reduce((a,r)=>a+r.w,0);
    return o;
  }

  /* -------- Tipe rumah -------- */
  function house(t, rules){
    const LT=(+t.lotW)*(+t.lotD), floors=Math.max(1,+t.floors||1), LB=+t.LB, foot=LB/floors;
    const kdb = LT? foot/LT : NaN, klb = LT? LB/LT : NaN;
    const gsb=+rules.gsb||0, back=+rules.backSet||0;
    const maxDepth=(+t.lotD)-gsb-back, bw=Math.min(+t.lotW, foot/Math.max(1,Math.min(maxDepth,foot/Math.max(1,+t.lotW))));
    const bd = foot/Math.max(0.1, +t.lotW); // rumah deret/kopel: lebar bangunan = lebar kavling
    const fitDepth = bd <= maxDepth+1e-6;
    const kdh = LT? Math.max(0, (LT - foot - (+t.lotW)*Math.min(gsb, +rules.paveFront||0))/LT) : NaN;
    return {LT,LB,foot,floors,kdb,klb,kdh,bw:+t.lotW,bd,maxDepth,fitDepth};
  }

  /* -------- Biaya, pendapatan, arus kas -------- */
  function feasibility(P, lay, styleFactor){
    const s=P.site, c=P.cost, sale=P.sales, fin=P.fin, T=P.types;
    const units = T.map((t,i)=>lay.lots.filter(l=>l.type===i).length);
    const nU = units.reduce((a,b)=>a+b,0);
    const revenueByType = T.map((t,i)=>units[i]*(+t.price||0));
    const komRev = (lay.area&&lay.area.kom||0)*(+s.komPrice||0);
    const revenue = revenueByType.reduce((a,b)=>a+b,0)+komRev;
    const land = lay.A*(+s.landPrice||0)*(1+(+c.landTxPct||0)/100);
    const prep = lay.A*(+c.prepM2||0);
    const roads = lay.area.road*(+c.roadM2||0);
    const drain = Math.max(0,lay.roadLen)*2*(+c.drainM||0);
    const rth = (lay.area.rth+lay.area.sisa)*(+c.rthM2||0);
    const fasum = lay.area.fasum*(+c.fasumM2||0) + lay.area.makam*(+c.makamM2||0);
    const util = nU*(+c.utilUnit||0);
    const infra = prep+roads+drain+rth+fasum+util;
    const consByType = T.map((t,i)=>units[i]*(+t.LB||0)*(+c.buildM2||0)*(styleFactor(t)||1));
    const cons = consByType.reduce((a,b)=>a+b,0);
    const permits = (+c.permitLump||0) + nU*(+c.certUnit||0);
    const contingency = (infra+cons)*(+c.contPct||0)/100;
    const marketing = revenue*(+c.mktPct||0)/100;
    const taxRate = (P.rules.simple? 1:2.5)/100;
    const tax = revenue*taxRate;
    const overhead = (land+infra+cons+permits)*(+c.ohPct||0)/100;
    const total = land+infra+cons+permits+contingency+marketing+tax+overhead;
    const profit = revenue-total;
    const items=[['Lahan (termasuk biaya peralihan)',land],['Pematangan lahan',prep],['Jalan',roads],['Saluran drainase',drain],['RTH & taman',rth],['Fasum & makam',fasum],['Utilitas (air, listrik) per unit',util],['Konstruksi rumah',cons],['Perizinan & sertifikat',permits],['Cadangan tak terduga',contingency],['Pemasaran',marketing],['PPh final penjualan ('+fmt(taxRate*100,1)+'%)',tax],['Manajemen & umum',overhead]];

    /* arus kas bulanan (sebelum pembiayaan) */
    const H = Math.max(6, Math.round(+sale.horizon||48));
    const flow = new Array(H+1).fill(0), inflow=new Array(H+1).fill(0), outflow=new Array(H+1).fill(0);
    const add=(m,v)=>{ m=clamp(Math.round(m),0,H); if(v<0) outflow[m]+=-v; else inflow[m]+=v; flow[m]+=v; };
    add(0,-land); add(0,-(+c.permitLump||0));
    const infraM=Math.max(1,Math.round(+sale.infraMonths||6));
    for(let m=1;m<=infraM;m++){ add(m,-(infra)/infraM); add(m,-(contingency*(infra/(infra+cons||1)))/infraM); }
    const start=Math.max(0,Math.round(+sale.start||3)), rate=Math.max(0.1,+sale.perMonth||5), build=Math.max(1,Math.round(+sale.buildMonths||4)), dp=(+sale.dpPct||0)/100;
    let left=units.slice(), sold=0, m=start, soldBy=[];
    const avgPrice = nU? revenue/nU : 0;
    while(sold<nU && m<=H){
      let q=Math.min(rate, nU-sold);
      // sebar per tipe sebanding sisa unit
      const remTot = left.reduce((a,b)=>a+b,0)||1; let rev=0, cst=0;
      T.forEach((t,i)=>{ const qi=q*left[i]/remTot; left[i]-=qi; rev+=qi*(+t.price||0); cst+=qi*(+t.LB||0)*(+c.buildM2||0)*(styleFactor(t)||1); });
      sold+=q; soldBy.push([m,q]);
      add(m, rev*dp); add(m, -rev*(+c.mktPct||0)/100);
      for(let b=1;b<=build;b++){ add(m+b-1, -(cst+cst*(+c.contPct||0)/100)/build); add(m+b-1, -(cst*(+c.ohPct||0)/100)/build); }
      add(m+build, rev*(1-dp)); add(m+build, -rev*taxRate); add(m+build, -(+c.certUnit||0)*q);

    if(komRev>0) for(let k=0;k<12;k++){ add(start+k, komRev/12); add(start+k, -komRev/12*((+c.mktPct||0)/100+taxRate)); }

    // pembiayaan pengembang
    const loanCap = total*(+fin.loanPct||0)/100, iLoan=(+fin.loanRate||0)/100/12, sweep=(+fin.sweepPct||100)/100;
    let debt=0, cash=0, peakDebt=0, totInt=0, equity=0; const eqFlow=new Array(H+1).fill(0), debtBy=[];
    for(let t=0;t<=H;t++){
      let cf=flow[t];
      const int=debt*iLoan; totInt+=int; cf-=int;
      if(cf<0){ const draw=Math.min(-cf, Math.max(0,loanCap-debt)); debt+=draw; cf+=draw; if(cf<0){ equity+=-cf; eqFlow[t]+=cf; cf=0; } }

    }

    let cum=0, peakNeg=0, payback=null; flow.forEach((v,t)=>{ cum+=v; peakNeg=Math.min(peakNeg,cum); if(payback===null && t>0 && cum>=0 && flow.slice(0,t).some(x=>x<0)) payback=t; });

      flow,inflow,outflow,H,sellMonths,soldBy,avgPrice,

})();

function vertCalc(V){

  const plate=Math.max(50,Math.min(+V.plate||0, fpMax||1e9)), room=gfaMax-podGFA-(V.baseInKLB?baseGFA:0);
  const twFl=Math.max(0,Math.min(maxFl-podFl, Math.floor(room/plate+1e-9))), twGFA=twFl*plate, gfa=twGFA+podGFA+(V.baseInKLB?baseGFA:0), gfaAll=twGFA+podGFA+baseGFA;

  const up=(+V.priceUp||0)/100, avgUp=twFl>1? up*(twFl-1)/2 : 0;
  rows.forEach(r=>{ r.price=r.a*r.pm2*(1+avgUp); r.rev=r.units*r.price; });
  const units=rows.reduce((s,r)=>s+r.units,0), sold=rows.reduce((s,r)=>s+r.area,0), rev=rows.reduce((s,r)=>s+r.rev,0);
  const perFloor=twFl? units/twFl : 0, height=(podFl+twFl)*(+V.floorH||3)+1.5;
  // NPP: berbanding nilai sarusun terhadap jumlah nilai (UU 20/2011 Ps. 1 angka 13) — atau luas, sesuai pilihan
  const basis=V.nppBasis==='luas'? r=>r.a : r=>r.price, tot=rows.reduce((s,r)=>s+r.units*basis(r),0)||1;
  rows.forEach(r=>{ r.npp=basis(r)/tot*100; });
  // parkir
  const parkNeed=Math.ceil(units*(+V.parkPer||0)), lot=Math.max(12,+V.lotM2||30), surf=Math.max(0,A-Math.max(podFl?podPlate:0,plate)-A*(+V.kdh||0)/100)*.6, parkCap=Math.floor((V.podUse==='parkir'?podGFA*.85:0)/lot + baseGFA*.85/lot + surf/lot);
  const lifts=twFl+podFl>5 ? Math.max(2,Math.ceil(units/Math.max(20,+V.liftPer||80))) : 0;

  const K=VKIND[V.kind]||VKIND.apartemen, hbArea=K.komersial? .2*(twGFA+podGFA) : 0, hbCost=V.hb&&K.komersial? hbArea*(+V.hbM2||0) : 0;
  // biaya
  const land=A*(+V.landPrice||0), landTx=land*(+V.landTxPct||0)/100, cons=twGFA*(+V.struM2||0)+podGFA*(+V.podM2||0)+baseGFA*(+V.baseM2||0);
  const soft=cons*(+V.softPct||0)/100, cont=cons*(+V.contPct||0)/100, mkt=rev*(+V.mktPct||0)/100, pph=rev*(+V.pphPct||0)/100;

  // penerimaan = uang muka/cicilan selama pembangunan (dp%), sisa saat serah terima (akhir konstruksi) atau saat terjual bila sesudahnya
  const S=V.sched||{}, pre=Math.max(0,Math.round(+S.pre||0)), bld=Math.max(1,Math.round(+S.build||1)), s0=Math.max(0,Math.round(+S.salesStart||0)), sm=Math.max(1,Math.round(+S.salesMonths||1)), dp=clamp((+S.dpPct||0)/100,0,1);

/* Potongan massa: basement, podium, menara (skala tinggi) */
function vertSecSVG(R,V){
  const fh=+V.floorH||3, W=360, H=300, gY=230, tw=Math.sqrt(R.plate)*1.05, pw=Math.sqrt(Math.max(R.podPlate,R.plate))*1.3, bw=Math.sqrt(Math.max(R.basePlate,1))*1.3;
  const totH=(R.podFl+R.twFl)*fh+R.baseFl*3.2, sc=Math.min((gY-20)/Math.max(1,(R.podFl+R.twFl)*fh), (H-gY-10)/Math.max(1,R.baseFl*3.2+0.01), 200/Math.max(pw,bw,tw,1));
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Potongan massa"><rect x="0" y="${gY}" width="${W}" height="${H-gY}" fill="var(--paper)"/><line x1="0" x2="${W}" y1="${gY}" y2="${gY}" stroke="var(--ink)" stroke-width="1.5"/>`;
  const cx=W/2-70;
  for(let i=0;i<R.baseFl;i++){ const y=gY+i*3.2*sc; g+=`<rect x="${cx-bw*sc/2}" y="${y}" width="${bw*sc}" height="${3.2*sc}" fill="var(--road)" opacity=".55" stroke="var(--ink)" stroke-width=".6"/>`; }
  for(let i=0;i<R.podFl;i++){ const y=gY-(i+1)*fh*sc; g+=`<rect x="${cx-pw*sc/2}" y="${y}" width="${pw*sc}" height="${fh*sc}" fill="${V.podUse==='parkir'?'var(--road)':'var(--fasum)'}" opacity=".6" stroke="var(--ink)" stroke-width=".6"/>`; }
  for(let i=0;i<R.twFl;i++){ const y=gY-(R.podFl+i+1)*fh*sc; g+=`<rect x="${cx-tw*sc/2}" y="${y}" width="${tw*sc}" height="${fh*sc}" fill="var(--lot)" opacity=".75" stroke="var(--ink)" stroke-width="${R.twFl>25?.25:.5}"/>`; }
  const lx=cx+Math.max(pw,tw)*sc/2+10, t=(y,s,c='var(--muted)')=>`<text x="${lx}" y="${y}" font-size="10.5" fill="${c}">${s}</text>`;
  if(R.twFl) g+=t(gY-(R.podFl+R.twFl/2)*fh*sc,`Menara ${R.twFl} lt · ${fmt(R.twGFA)} m²`,'var(--ink)');
  let yP=gY-R.podFl*fh*sc/2+4, yB=gY+R.baseFl*3.2*sc/2+4; if(R.podFl&&R.baseFl&&yB-yP<14){ yP=gY-4; yB=gY+14; }

  if(R.baseFl) g+=t(yB,`Basement ${R.baseFl} lt`);

}
/* Bentuk massa menara: koridor ganda; bila lempeng terlalu panjang untuk lahan, dipecah menjadi 2–4 massa sejajar (luas lantai tipikal = jumlah semua massa) */

/* Denah lantai tipikal menara (terukur, satuan meter): koridor ganda, inti lif & tangga, unit dengan KM, dapur, kamar, balkon & perabot */

function migrate(j){ const d=defaultProject(); for(const k of Object.keys(d)) if(j[k]==null) j[k]=d[k]; for(const k of ['site','plan','rules','cost','sales','fin','kpr','loc','gk']) j[k]=Object.assign({},d[k],j[k]); j.loc.rdtr=Object.assign({},d.loc.rdtr,j.loc.rdtr||{}); j.loc.addr=j.loc.addr||{}; j.loc.poly=Array.isArray(j.loc.poly)?j.loc.poly:[]; { const vd=vertDefault((j.vert&&VKIND[j.vert.kind])?j.vert.kind:'apartemen'); j.vert=Object.assign(vd,j.vert||{}); j.vert.sched=Object.assign({},vd.sched,j.vert.sched||{}); if(!Array.isArray(j.vert.mix)||!j.vert.mix.length) j.vert.mix=vd.mix; } return j; }
let saveT=0; function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem('rp.project',JSON.stringify(P)); }catch(e){} },300); }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2200); }
/* konfirmasi dua klik (tanpa confirm/alert) */
function confirmArm(btn, fn, label){ if(btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent=btn.dataset.lbl; fn(); return; } btn.dataset.lbl=btn.textContent; btn.dataset.armed=1; btn.classList.add('armed'); btn.textContent=label||'Klik lagi untuk yakin'; setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent=btn.dataset.lbl; } },3500); }

const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{ const ks=p.split('.'); let a=o; for(let i=0;i<ks.length-1;i++) a=a[ks[i]]; a[ks[ks.length-1]]=v; };
const styleFactor = t => (t.sf!=null && t.sf!=='' && isFinite(+t.sf))? +t.sf : (STYLES[t.style]||STYLES.minimalis).f;
function calc(){ const lay=RP.layout(Object.assign({},P.site,P.plan),P.types); const fe=RP.feasibility(P,lay,styleFactor); return {lay,fe}; }

/* ---------- Komponen formulir ---------- */
function F(path,label,unit,opt={}){
  const v=getPath(P,path);
  if(opt.sel) return `<label class="f">${label}<select data-k="${path}" ${opt.num?'data-num="1"':''}>${opt.sel.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>${unit?`<span class="u">${unit}</span>`:''}</label>`;
  if(opt.chk) return `<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-k="${path}" ${v?'checked':''}> ${label}</label>`;
  return `<label class="f">${label}<input type="number" step="${opt.step||'any'}" min="${opt.min??0}" data-k="${path}" value="${v==null?'':esc(v)}">${unit?`<span class="u">${unit}</span>`:''}</label>`;
}
function bindInputs(root, after){
  $$('[data-k]',root).forEach(el=>{
    const ev = el.tagName==='SELECT'||el.type==='checkbox'?'change':'input';
    el.addEventListener(ev,()=>{
      const p=el.dataset.k; let v = el.type==='checkbox'? el.checked : el.value;
      if(el.type==='number' || el.dataset.num) v = v===''? '' : +v;
      setPath(P,p,v); persist(); after&&after();
    });
  });
}

  const R=(r,a)=>`<rect x="${X(r.x)}" y="${Y(r.y)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}" ${a}/>`;

  // jalan akses di luar kawasan (sisi muka)
  g+=`<rect x="0" y="${(top-big*.045).toFixed(2)}" width="${vw.toFixed(2)}" height="${(big*.04).toFixed(2)}" fill="${ROAD}"/><line x1="0" x2="${vw.toFixed(2)}" y1="${(top-big*.025).toFixed(2)}" y2="${(top-big*.025).toFixed(2)}" stroke="#fff" stroke-width="${lw*2}" stroke-dasharray="${lw*14} ${lw*10}"/>`;
  g+=`<text x="${(pad).toFixed(2)}" y="${(top-big*.05).toFixed(2)}" font-size="${(big*.016).toFixed(2)}" fill="var(--muted)">JALAN AKSES / JALAN UTAMA KOTA</text>`;
  g+=`<rect x="${X(0)}" y="${Y(0)}" width="${W}" height="${D}" fill="${GR}"/>`;
  lay.rth.concat(lay.sisa).forEach(r=>{ g+=R(r,`fill="${LAWN}"`); if(r.w>8&&r.h>8){ g+=`<path d="M${X(r.x+r.w*.1)} ${Y(r.y+r.h*.85)} Q${X(r.x+r.w*.5)} ${Y(r.y+r.h*.1)} ${X(r.x+r.w*.9)} ${Y(r.y+r.h*.7)}" fill="none" stroke="${PAVE}" stroke-width="${Math.min(2,r.h*.08).toFixed(2)}"/>`;
      if(r.w>14&&r.h>10&&!r.end) g+=`<circle cx="${X(r.x+r.w*.5)}" cy="${Y(r.y+r.h*.5)}" r="${Math.min(4,r.h*.18).toFixed(2)}" fill="#e9c9a0" stroke="var(--ink)" stroke-width="${lw}"/>`;
      for(let x=r.x+3;x<r.x+r.w-2;x+=7) for(let y=r.y+3;y<r.y+r.h-2;y+=8) if(((x*7+y*3)|0)%3) g+=tree(x+((y|0)%3),y,2.2); } });
  lay.fasum.forEach(r=>{ g+=R(r,`fill="${PAVE}"`); const bw=Math.min(r.w*.6,20), bd=Math.min(r.h*.6,14); if(bw>4&&bd>4){ const bx=r.x+(r.w-bw)/2, by=r.y+(r.h-bd)/2; g+=`<rect x="${X(bx)}" y="${Y(by)}" width="${bw}" height="${bd}" fill="var(--fasum)" stroke="var(--ink)" stroke-width="${lw*1.5}"/><line x1="${X(bx)}" y1="${Y(by)}" x2="${X(bx+bd/2)}" y2="${Y(by+bd/2)}" stroke="var(--ink)" stroke-width="${lw}"/><line x1="${X(bx+bw)}" y1="${Y(by)}" x2="${X(bx+bw-bd/2)}" y2="${Y(by+bd/2)}" stroke="var(--ink)" stroke-width="${lw}"/><line x1="${X(bx)}" y1="${Y(by+bd)}" x2="${X(bx+bd/2)}" y2="${Y(by+bd/2)}" stroke="var(--ink)" stroke-width="${lw}"/><line x1="${X(bx+bw)}" y1="${Y(by+bd)}" x2="${X(bx+bw-bd/2)}" y2="${Y(by+bd/2)}" stroke="var(--ink)" stroke-width="${lw}"/><line x1="${X(bx+bd/2)}" y1="${Y(by+bd/2)}" x2="${X(bx+bw-bd/2)}" y2="${Y(by+bd/2)}" stroke="var(--ink)" stroke-width="${lw}"/>`; } });
  lay.makam.forEach(r=>{ g+=R(r,`fill="#d6d1c6"`); for(let x=r.x+1.5;x<r.x+r.w-1;x+=2.5) for(let y=r.y+1.5;y<r.y+r.h-1;y+=3.2) g+=`<rect x="${X(x)}" y="${Y(y)}" width="1" height="2" fill="#f2efe8" stroke="#9a948a" stroke-width="${lw*.6}"/>`; });
  // zona komersial: ruko 3 lantai, parkir depan

    if(!r.sisa){ g+=`<rect x="${X(r.x+.15)}" y="${Y(r.y+pk)}" width="${(r.w-.3).toFixed(2)}" height="${bd.toFixed(2)}" fill="#e3a68e" stroke="var(--ink)" stroke-width="${lw*1.2}"/>`; g+=`<line x1="${X(r.x+r.w/2)}" y1="${Y(r.y+pk+.4)}" x2="${X(r.x+r.w/2)}" y2="${Y(r.y+pk+bd-.4)}" stroke="#9c5a43" stroke-width="${lw*.7}"/>`; } else g+=R({x:r.x,y:r.y+pk,w:r.w,h:r.h-pk},`fill="${LAWN}"`); });
  if((lay.kom||[]).length) lay.kom.forEach(k=>{ if(k.w>W*.12) g+=`<text x="${X(k.x+k.w/2)}" y="${Y(k.y+k.h*.62)}" font-size="${Math.min(k.h*.18,big*.02).toFixed(2)}" text-anchor="middle" fill="var(--ink)" font-weight="700" stroke="#ffffff" stroke-width="${(lw*4).toFixed(2)}" paint-order="stroke">KOMERSIAL / RUKO</text>`; });
  // jalan: perkerasan, trotoar, marka
  lay.roads.forEach(r=>{ g+=R(r,`fill="${ROAD}"`); const hz=r.w>r.h, sw=Math.min(1.2,(hz?r.h:r.w)*.15);
    g+= hz? R({x:r.x,y:r.y,w:r.w,h:sw},`fill="${KERB}"`)+R({x:r.x,y:r.y+r.h-sw,w:r.w,h:sw},`fill="${KERB}"`) : R({x:r.x,y:r.y,w:sw,h:r.h},`fill="${KERB}"`)+R({x:r.x+r.w-sw,y:r.y,w:sw,h:r.h},`fill="${KERB}"`); });
  lay.roads.forEach(r=>{ const hz=r.w>r.h; const x1=r.x+(hz?0:r.w/2), y1=r.y+(hz?r.h/2:0), x2=hz?x1+r.w:x1, y2=hz?y1:y1+r.h; g+=`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="#ffffff" stroke-width="${lw*1.6}" stroke-dasharray="${lw*10} ${lw*8}"/>`; });
  // kavling: halaman, rumah (denah atap perisai), jalan masuk, pohon depan
  const gsb=+P.rules.gsb||3;
  lay.lots.forEach((l,i)=>{ g+=R(l,`fill="${LAWN}" stroke="#7f8f6f" stroke-width="${lw*.6}"`); const t=P.types[l.type]; if(!t) return; const fl=Math.max(1,+t.floors||1), bd=Math.max(3,Math.min(l.h-gsb-.5,(+t.LB/fl)/l.w)), by=l.face==='atas'? l.y+gsb : l.y+l.h-gsb-bd;
    const col=TYPE_COLORS[l.type%TYPE_COLORS.length]; g+=`<rect x="${X(l.x+.25)}" y="${Y(by)}" width="${(l.w-.5).toFixed(2)}" height="${bd.toFixed(2)}" fill="${col}" stroke="var(--ink)" stroke-width="${lw*1.1}"/>`;
    const r2=Math.min((l.w-.5)/2,bd/2), cx0=l.x+.25, cx1=l.x+l.w-.25; g+=`<path d="M${X(cx0)} ${Y(by)} L${X(cx0+r2)} ${Y(by+r2)} L${X(cx1-r2)} ${Y(by+bd-r2)} L${X(cx1)} ${Y(by+bd)} M${X(cx1)} ${Y(by)} L${X(cx1-r2)} ${Y(by+r2)} M${X(cx0)} ${Y(by+bd)} L${X(cx0+r2)} ${Y(by+bd-r2)}" fill="none" stroke="var(--ink)" stroke-opacity=".45" stroke-width="${lw*.7}"/>`;
    const dy=l.face==='atas'? l.y : by+bd; g+=`<rect x="${X(l.x+.4)}" y="${Y(dy)}" width="${Math.min(2.8,l.w*.45).toFixed(2)}" height="${gsb.toFixed(2)}" fill="${PAVE}"/>`;
    if(i%2===0&&l.w>=5) g+=tree(l.x+l.w-1.2, l.face==='atas'? l.y+1.2 : l.y+l.h-1.2, 1.3);

/* Denah skematik satu lantai (rumah deret/kopel; lebar bangunan = lebar kavling) */
function floorPlan(t){
  const R=P.rules, w=+t.lotW, d=+t.lotD, floors=Math.max(1,+t.floors||1), foot=(+t.LB)/floors, gsb=+R.gsb, back=+R.backSet;
  const bd=Math.max(3,Math.min(d-gsb-0.5, foot/w)), beds=Math.max(1,+t.beds||1), baths=Math.max(1,+t.baths||1);
  const rooms=[]; const R1=(n,x,y,ww,hh,c)=>rooms.push({n,x,y,w:ww,h:hh,c});
  // lantai 1: depan→belakang
  const y0=gsb, x0=0, teras=Math.min(1.5,bd*0.15);
  const bedsDown = floors>1? Math.max(0,beds-2) : beds, bathsDown= floors>1? 1 : baths;
  const colL = bedsDown>0? Math.max(2.6, w*0.48) : w;
  R1('Teras',x0,y0,w,teras,'var(--paper)');
  const yR=y0+teras, hR=bd-teras;
  if(bedsDown>0){
    const kt=Math.min(3.2,hR/Math.max(1,bedsDown+0.6));
    for(let i=0;i<bedsDown;i++) R1(i===0?'KT utama':'KT '+(i+1), colL, yR+i*kt, w-colL, kt, 'var(--accent-soft)');
    const used=bedsDown*kt, kmH=Math.min(1.8, hR-used);
    if(kmH>0.8) R1('KM',colL,yR+used,w-colL,kmH,'var(--lot4)');
    const lvH=hR*0.62; R1(floors>1?'R. keluarga + tangga':'R. tamu & keluarga',x0,yR,colL,lvH,'var(--warm-soft)');
    R1('Dapur & makan',x0,yR+lvH,colL,hR-lvH,'var(--lot)');
    if(kmH<=0.8) R1('KM',x0+colL*0.6,yR+lvH,colL*0.4,hR-lvH,'var(--lot4)');
  } else {
    const lvH=hR*0.6; R1('R. keluarga + tangga',x0,yR,w,lvH,'var(--warm-soft)'); R1('Dapur & makan',x0,yR+lvH,w*0.65,hR-lvH,'var(--lot)'); R1('KM',x0+w*0.65,yR+lvH,w*0.35,hR-lvH,'var(--lot4)');
  }
  const carport = gsb>=2.5;
  return {w,d,bd,gsb,back,rooms,carport,upBeds: floors>1? Math.min(beds,2):0, upBaths: floors>1? Math.max(1,baths-bathsDown):0};
}
function floorPlanSVG(t){
  const fp=floorPlan(t), pad=1.2, vw=fp.w+pad*2+3.2, vh=fp.d+pad*2;
  let g=`<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Denah skematik">`;
  g+=`<rect x="${pad}" y="${pad}" width="${fp.w}" height="${fp.d}" fill="var(--rth)" opacity=".35" stroke="var(--muted)" stroke-width=".05" stroke-dasharray=".25 .2"/>`;
  if(fp.carport) g+=`<rect x="${pad+0.2}" y="${pad+0.2}" width="${Math.min(3,fp.w-0.4)}" height="${fp.gsb-0.4}" fill="var(--road)" opacity=".5"/><text x="${pad+0.2+Math.min(3,fp.w-0.4)/2}" y="${pad+fp.gsb/2}" font-size=".42" text-anchor="middle" fill="var(--ink)">Carport</text>`;
  fp.rooms.forEach(r=>{ g+=`<rect x="${(pad+r.x).toFixed(2)}" y="${(pad+r.y).toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}" fill="${r.c}" stroke="var(--ink)" stroke-width=".1"/>`;
    const fs=Math.min(.42, (r.w-0.2)/(r.n.length*0.56), r.h/2.4); g+=`<text x="${(pad+r.x+r.w/2).toFixed(2)}" y="${(pad+r.y+r.h/2).toFixed(2)}" font-size="${fs.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)">${esc(r.n)}</text>`;
    if(r.w>1.6&&r.h>1.2) g+=`<text x="${(pad+r.x+r.w/2).toFixed(2)}" y="${(pad+r.y+r.h/2+fs*1.2).toFixed(2)}" font-size="${(fs*.75).toFixed(2)}" text-anchor="middle" fill="var(--muted)">${fmt(r.w*r.h,1)} m²</text>`; });
  g+=`<rect x="${pad}" y="${pad+fp.gsb}" width="${fp.w}" height="${fp.bd}" fill="none" stroke="var(--ink)" stroke-width=".22"/>`;
  // dimensi
  g+=`<text x="${pad+fp.w/2}" y="${pad-0.35}" font-size=".45" text-anchor="middle" fill="var(--muted)">${fmt(fp.w,1)} m</text>`;
  g+=`<text x="${pad+fp.w+0.3}" y="${pad+fp.d/2}" font-size=".45" fill="var(--muted)">${fmt(fp.d,1)} m</text>`;
  g+=`<text x="${pad+fp.w+0.3}" y="${pad+fp.gsb/2}" font-size=".38" fill="var(--muted)">GSB ${fmt(fp.gsb,1)}</text>`;
  g+=`<text x="${pad+fp.w+0.3}" y="${pad+0.45}" font-size=".4" fill="var(--warm)">← jalan</text>`;
  return g+'</svg>';
}

/* ---------- Denah terukur (gambar kerja): dinding bertebal, pintu berayun, jendela, perabot, dimensi berantai, as/grid ----------
   Satuan meter. Lantai 1 dari floorPlan(); lantai 2 disusun dari sisa kamar. Bukan pengganti gambar arsitek. */
function archPlan(t,lvl){ const fp=floorPlan(t); if(lvl!==2) return {fp,rooms:fp.rooms,front:fp.gsb+(fp.rooms.find(r=>r.n==='Teras')||{h:0}).h,open:'Teras'};
  const w=fp.w, y0=fp.gsb, bd=fp.bd, rooms=[], R1=(n,x,y,ww,hh,c)=>rooms.push({n,x,y,w:ww,h:hh,c});
  const bal=Math.min(1.2,bd*.12), yR=y0+bal, hR=bd-bal, beds=Math.max(1,fp.upBeds||1), colL=Math.max(2.6,w*.45);
  R1('Balkon',0,y0,w,bal,'var(--paper)'); const kt=hR/(beds+.55);
  for(let i=0;i<beds;i++) R1('KT '+(i+1),colL,yR+i*kt,w-colL,kt,'var(--accent-soft)');
  R1('KM',colL,yR+beds*kt,w-colL,hR-beds*kt,'var(--lot4)'); R1('R. keluarga atas + tangga',0,yR,colL,hR*.72,'var(--warm-soft)'); R1('Ruang cuci & jemur',0,yR+hR*.72,colL,hR*.28,'var(--lot)');

function shade(hex,amt){ if(!/^#[0-9a-f]{6}$/i.test(hex)) return hex; const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const f=v=>clamp(Math.round(amt<0? v*(1+amt) : v+(255-v)*amt),0,255); return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); }

function donut(parts){ // [[label,value,color]]

RP.polyMetrics = pts => {
  if(!pts||pts.length<3) return null;
  const R=6371008.8, n=pts.length, latc=pts.reduce((a,p)=>a+p[0],0)/n, lonc=pts.reduce((a,p)=>a+p[1],0)/n, k=Math.PI/180;
  const xy=pts.map(p=>[(p[1]-lonc)*k*R*Math.cos(latc*k),(p[0]-latc)*k*R]);
  let A=0, per=0; for(let i=0;i<n;i++){ const a=xy[i], b=xy[(i+1)%n]; A+=a[0]*b[1]-b[0]*a[1]; per+=Math.hypot(b[0]-a[0],b[1]-a[1]); } A=Math.abs(A)/2;
  const front=Math.hypot(xy[1][0]-xy[0][0],xy[1][1]-xy[0][1]);
  let best=null; for(let i=0;i<n;i++){ const a=xy[i], b=xy[(i+1)%n], g=Math.atan2(b[1]-a[1],b[0]-a[0]), c=Math.cos(-g), s=Math.sin(-g); let x0=1e18,x1=-1e18,y0=1e18,y1=-1e18;
    for(const p of xy){ const x=p[0]*c-p[1]*s, y=p[0]*s+p[1]*c; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } const w=x1-x0, h=y1-y0; if(!best||w*h<best.w*best.h) best={w,h}; }
  return {area:A, perim:per, front, depthEq:A/Math.max(front,1e-9), rectW:Math.min(best.w,best.h), rectD:Math.max(best.w,best.h), center:[latc,lonc]};
};
/* Saran wilayah batas harga rumah umum dari nama provinsi/kabupaten-kota (Kepmen PKP 1722/KPTS/M/2026) — tetap periksa lampiran Kepmen */
RP.zoneFor = (prov,kab) => { const p=String(prov||'').toLowerCase(), k=String(kab||'').toLowerCase(); if(!p&&!k) return null;
  if(/papua/.test(p)) return 5;
  if(/jakarta|bali|nusa tenggara|maluku/.test(p)) return 4;
  if(/tangerang|bogor|depok|bekasi|anambas|murung raya|mahakam ulu/.test(k)) return 4;
  if(/kalimantan/.test(p)) return 3;
  if(/kepulauan riau|bangka|belitung|sulawesi|gorontalo/.test(p)||/mentawai/.test(k)) return 2;
  if(/aceh|sumatera|sumatra|riau|jambi|bengkulu|lampung|jawa|banten|yogyakarta/.test(p)) return 1;
  return null; };
const OSM_TILE='https://tile.openstreetmap.org/', NOMI='https://nominatim.openstreetmap.org/';
function slippy(el, st, onChange){
  el.innerHTML='<div class="mp-tiles"></div><svg class="mp-svg"></svg><div class="mp-attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>';
  const tl=el.querySelector('.mp-tiles'), sv=el.querySelector('.mp-svg'), T=256;
  const proj=(lat,lon,z)=>{ const m=T*2**z, s=Math.sin(Math.max(-85,Math.min(85,lat))*Math.PI/180); return [(lon+180)/360*m,(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*m]; };
  const unproj=(x,y,z)=>{ const m=T*2**z, q=Math.PI-2*Math.PI*y/m; return [180/Math.PI*Math.atan(Math.sinh(q)), x/m*360-180]; };
  let W=0,H=0,last=null;
  const overlay=()=>{ const c=proj(st.lat,st.lon,st.z), x0=c[0]-W/2, y0=c[1]-H/2; const pts=(st.poly||[]).map(p=>{ const q=proj(p[0],p[1],st.z); return [+(q[0]-x0).toFixed(1),+(q[1]-y0).toFixed(1)]; });
    let g=''; if(pts.length){ g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" class="mp-poly${pts.length<3?' open':''}"/>`; if(pts.length>=2) g+=`<line x1="${pts[0][0]}" y1="${pts[0][1]}" x2="${pts[1][0]}" y2="${pts[1][1]}" class="mp-front"/>`; pts.forEach((p,i)=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===0?6:4.5}" class="mp-v${i===0?' first':''}"/>`); }
    g+=`<g class="mp-cross"><line x1="${W/2-8}" y1="${H/2}" x2="${W/2+8}" y2="${H/2}"/><line x1="${W/2}" y1="${H/2-8}" x2="${W/2}" y2="${H/2+8}"/></g>`;
    sv.setAttribute('viewBox',`0 0 ${W||1} ${H||1}`); sv.innerHTML=g; return [x0,y0]; };
  const draw=()=>{ W=el.clientWidth; H=el.clientHeight; const [x0,y0]=overlay(), z=st.z, m=2**z; let h='';
    for(let ty=Math.floor(y0/T); ty<=Math.floor((y0+H)/T); ty++){ if(ty<0||ty>=m) continue; for(let tx=Math.floor(x0/T); tx<=Math.floor((x0+W)/T); tx++){ const wx=((tx%m)+m)%m; h+=`<img src="${OSM_TILE}${z}/${wx}/${ty}.png" style="left:${Math.round(tx*T-x0)}px;top:${Math.round(ty*T-y0)}px" alt="" draggable="false" onerror="this.style.visibility='hidden'">`; } }
    tl.style.transform=''; tl.innerHTML=h; last=[x0,y0]; };
  const quick=()=>{ const [x0,y0]=overlay(); if(last) tl.style.transform=`translate(${Math.round(last[0]-x0)}px,${Math.round(last[1]-y0)}px)`; };
  const zoomAt=(d,px,py)=>{ const z2=Math.max(3,Math.min(19,st.z+d)); if(z2===st.z) return; if(px==null){ px=W/2; py=H/2; } const c=proj(st.lat,st.lon,st.z), ll=unproj(c[0]-W/2+px,c[1]-H/2+py,st.z), c2=proj(ll[0],ll[1],z2), nc=unproj(c2[0]-px+W/2,c2[1]-py+H/2,z2); st.z=z2; st.lat=nc[0]; st.lon=nc[1]; draw(); onChange&&onChange('view'); };
  let drag=null, wt=0;
  el.addEventListener('pointerdown',e=>{ if(e.target.closest('a')) return; el.setPointerCapture&&el.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,moved:false,c:proj(st.lat,st.lon,st.z)}; });
  el.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<5) return; drag.moved=true; const ll=unproj(drag.c[0]-dx,drag.c[1]-dy,st.z); st.lat=ll[0]; st.lon=ll[1]; quick(); });
  el.addEventListener('pointerup',e=>{ if(!drag) return; const d=drag; drag=null;
    if(!d.moved&&st.mode==='draw'){ const r=el.getBoundingClientRect(), c=proj(st.lat,st.lon,st.z), ll=unproj(c[0]-W/2+(e.clientX-r.left),c[1]-H/2+(e.clientY-r.top),st.z); st.poly=(st.poly||[]).concat([[+ll[0].toFixed(7),+ll[1].toFixed(7)]]); draw(); onChange&&onChange('poly'); return; }
    draw(); onChange&&onChange('view'); });
  el.addEventListener('wheel',e=>{ e.preventDefault(); if(Date.now()-wt<220) return; wt=Date.now(); const r=el.getBoundingClientRect(); zoomAt(e.deltaY<0?1:-1,e.clientX-r.left,e.clientY-r.top); },{passive:false});
  if(window.ResizeObserver){ const ro=new ResizeObserver(()=>{ if(el.isConnected) draw(); else ro.disconnect(); }); ro.observe(el); }
  draw();
  return {draw, zoom:d=>zoomAt(d), go:(lat,lon,z)=>{ st.lat=lat; st.lon=lon; if(z) st.z=z; draw(); onChange&&onChange('view'); }};
}
const lokLink=(href,t,d)=>`<li><a href="${esc(href)}" target="_blank" rel="noopener"><b>${t}</b></a><br><span class="note">${d}</span></li>`;
