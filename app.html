<script>
/* ===================================================================
   Rancang Perumahan — mesin hitung (murni, dapat diuji) + antarmuka
   Dibuat oleh Pindo Tutuko. Semua diagram SVG manual, tanpa pustaka.
   =================================================================== */
'use strict';

/* ---------- Rujukan (wajib dapat diverifikasi) ---------- */
const CREDIT = [
  {k:'kepmen1722', t:'Keputusan Menteri Perumahan dan Kawasan Permukiman Nomor 1722/KPTS/M/2026 tentang Kriteria Rumah Umum Tapak dalam Fasilitasi Pemerintah Pusat (ditetapkan 6 Agustus 2026).',
   d:'Luas lahan efektif 60–200 m², lebar muka kaveling paling kecil 5 m, luas lantai 21–36 m², jangka waktu KPR paling lama 40 tahun, suku bunga 5% per tahun (atau berjenjang sesuai kebijakan), batas harga jual per wilayah, bantuan uang muka Rp4 juta (Papua Rp10 juta). Mencabut Kepmen PUPR 689/KPTS/M/2023 dan 995/KPTS/M/2021.',
   u:'https://jdih.pkp.go.id/produk-hukum/file/2026kptsmpkp1722_1786327915.pdf', tag:'dipakai: cek rumah umum, preset KPR subsidi'},
  {k:'pp34', t:'Peraturan Pemerintah Nomor 34 Tahun 2016 tentang Pajak Penghasilan atas Penghasilan dari Pengalihan Hak atas Tanah dan/atau Bangunan, dan Perjanjian Pengikatan Jual Beli atas Tanah dan/atau Bangunan beserta Perubahannya.',
   d:'Pasal 2 ayat (1): tarif PPh final 2,5% dari nilai bruto pengalihan; 1% untuk Rumah Sederhana/Rumah Susun Sederhana oleh wajib pajak yang usaha pokoknya pengalihan tanah/bangunan.',
   u:'https://setkab.go.id/pp-no-342016-pph-pengalihanjual-beli-tanahbangunan-25-di-bawah-rp-60-juta-dikecualikan/', tag:'dipakai: PPh final penjualan'},
  {k:'permendagri15', t:'Peraturan Menteri Dalam Negeri Nomor 15 Tahun 2026 tentang Penyerahan Prasarana, Sarana, dan Utilitas Umum Perumahan kepada Pemerintah Daerah Kabupaten/Kota (mencabut Permendagri Nomor 9 Tahun 2009).',
   d:'Dasar penyerahan PSU dari pengembang kepada pemerintah daerah. Proporsi minimal PSU ditetapkan dalam peraturan daerah masing-masing.',
   u:'https://peraturan.bpk.go.id/Details/126323/permendagri-no-9-tahun-2009', tag:'dasar PSU'},
  {k:'perdaCimahi', t:'Contoh peraturan daerah: Peraturan Daerah Kota Cimahi Nomor 10 Tahun 2017 — pengembang wajib menyediakan lahan PSU paling sedikit 40% dari luas lahan perumahan.',
   d:'Dipakai sebagai nilai awal "PSU minimal 40%". Angka ini berbeda antardaerah — cek Perda PSU kabupaten/kota lokasi proyek.',
   u:'https://pasal.id/peraturan/perda/perda-kota-cimahi-10-2017', tag:'contoh daerah'},
  {k:'pp14', t:'Peraturan Pemerintah Nomor 14 Tahun 2016 tentang Penyelenggaraan Perumahan dan Kawasan Permukiman, sebagaimana telah diubah dengan Peraturan Pemerintah Nomor 12 Tahun 2021.',
   d:'Kerangka penyelenggaraan perumahan, termasuk kewajiban PSU dan hunian berimbang. Rincian angka mengikuti peraturan pelaksana.',
   u:'https://peraturan.bpk.go.id/', tag:'kerangka'},
  {k:'sni1733', t:'Badan Standardisasi Nasional. SNI 03-1733-2004 Tata cara perencanaan lingkungan perumahan di perkotaan. Jakarta: BSN, 2004.',
   d:'Acuan kebutuhan sarana lingkungan berdasarkan jumlah penduduk pendukung. Aplikasi ini tidak menyalin tabel SNI; isi tabel sarana di langkah Tapak dengan nilai dari dokumen SNI yang Anda pegang.',
   u:'https://perpus.petra.ac.id/catalog/site/detail?id=2300864', tag:'acuan sarana'}
];
/* Asumsi (bukan regulasi) — selalu dapat diubah pengguna */
const ASUMSI = [
  'KDB, KLB, KDH, dan garis sempadan bangunan ditetapkan RDTR/peraturan zonasi setempat; nilai awal di aplikasi hanya contoh.',
  'Satu kepala keluarga dihitung 4 jiwa (dapat diubah) untuk memperkirakan penduduk pendukung sarana.',
  'Daftar gaya fasad dan tipe rumah merangkum gaya yang banyak ditawarkan pengembang perumahan di Indonesia saat ini (pengamatan pasar, bukan regulasi); faktor biaya gaya hanyalah perkiraan.',
  'Tampak 3D dibuat secara prosedural dari ukuran tipe (lebar kavling, kedalaman bangunan, jumlah lantai) untuk studi massa, material, dan bayangan; bukan gambar kerja atau visual pemasaran yang mengikat.',
  'Biaya per m² (konstruksi, jalan, saluran, RTH) dan faktor biaya gaya fasad adalah perkiraan awal; ganti dengan harga satuan setempat atau hasil RAB rinci.',
  'Cicilan KPR memakai rumus anuitas bulanan; bank dapat memakai metode lain (efektif/berjenjang). Uang muka KPR subsidi mengikuti ketentuan program dan bank penyalur.',
  'Batas cicilan terhadap penghasilan (rasio angsuran) adalah kebijakan bank; nilai awal 30% hanya asumsi.'
];

/* ---------- Utilitas ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v,d=0)=>isFinite(v)?Number(v).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const rp = v => !isFinite(v)?'–':(Math.abs(v)>=1e9?'Rp '+fmt(v/1e9,2)+' M':Math.abs(v)>=1e6?'Rp '+fmt(v/1e6,1)+' jt':'Rp '+fmt(v));
const rpFull = v => isFinite(v)?'Rp '+fmt(Math.round(v)):'–';
const pct = (v,d=1)=>isFinite(v)?fmt(v*100,d)+'%':'–';

/* ===================================================================
   MESIN HITUNG
   =================================================================== */
const RP = (()=>{

  /* Cicilan anuitas: P pokok, i bunga tahunan (desimal), n bulan */
  function annuity(P,i,n){ if(n<=0) return 0; const r=i/12; return r===0? P/n : P*r/(1-Math.pow(1+r,-n)); }

  /* Jadwal KPR dengan bunga tetap selama `fixY` tahun lalu bunga mengambang `iFloat` (anuitas dihitung ulang atas sisa pokok) */
  function kpr({price,dpPct,i,years,fixY=0,iFloat=null,subsidy=0}){
    const down=Math.max(0,price*dpPct-subsidy), P=Math.max(0,price-price*dpPct), n=Math.round(years*12);
    let bal=P, rows=[], totI=0, pay=0, firstPay=0, laterPay=null;
    const fixN = (iFloat==null||fixY<=0)? n : Math.min(n,Math.round(fixY*12));
    for(let m=1;m<=n;m++){
      const rate = m<=fixN? i : iFloat;
      if(m===1||m===fixN+1) pay = annuity(bal, rate, n-m+1);
      if(m===1) firstPay=pay; if(m===fixN+1) laterPay=pay;
      const int=bal*rate/12, prin=Math.min(bal,pay-int); bal-=prin; totI+=int;
      if(m%12===0||m===n) rows.push({year:Math.ceil(m/12), bal:Math.max(0,bal), totI});
    }
    return {down, principal:P, n, firstPay, laterPay, totalInterest:totI, totalPaid:P+totI, rows};
  }

  /* NPV arus kas bulanan dengan tingkat diskonto tahunan efektif */
  function npv(flows, annualRate){ const r=Math.pow(1+annualRate,1/12)-1; return flows.reduce((a,f,t)=>a+f/Math.pow(1+r,t),0); }
  /* IRR bulanan (bisection pada NPV) → dikembalikan tahunan efektif */
  function irr(flows){

  const irrMonthly = flows => { const a=irr(flows); return isFinite(a)? Math.pow(1+a,1/12)-1 : NaN; };

  /* -------- Tata letak tapak --------
     Lahan persegi panjang W (lebar, sumbu x) × D (panjang/kedalaman, sumbu y), pintu masuk di y=0.
     Lajur depan: RTH + fasum + makam (bila ada). Lalu blok: jalan lingkungan, 2 deret kavling saling membelakangi, jalan, ...
     Jalan utama membujur (sumbu y) di tengah atau di tepi kiri. */
  function layout(p, types){
    const W=+p.W, D=+p.D, A=W*D, mainW=+p.mainW, lw=+p.localW, spine=p.spine||'tengah';
    const out={W,D,A,roads:[],lots:[],rth:[],fasum:[],makam:[],sisa:[],blocks:[],warn:[]};
    if(!(W>0&&D>0)) { out.warn.push('Ukuran lahan belum diisi.'); return finish(out,p); }
    // lajur depan
    const front = A*((+p.rthPct||0)+(+p.fasumPct||0)+(+p.makamPct||0))/100;
    let fd = Math.min(D*0.6, front/W);
        const parts=[['fasum',+p.fasumPct||0],['rth',+p.rthPct||0],['makam',+p.makamPct||0]].filter(q=>q[1]>0), tot=parts.reduce((a,q)=>a+q[1],0)||1;
    // jalan utama memotong lajur depan sebagai jalan masuk
    const sx = spine==='tengah'? (W-mainW)/2 : 0;
    if(fd>0){
      // bagi lebar lajur depan (dikurangi jalan masuk) sebanding porsi
      const segs = spine==='tengah'? [[0,sx],[sx+mainW,W]] : [[mainW,W]];
      const usable = segs.reduce((a,s)=>a+(s[1]-s[0]),0);
      fd = Math.min(D*0.6, front/Math.max(1,usable));
      let need = parts.map(q=>[q[0], usable*q[1]/tot]);
      for(const s of segs){ let cx=s[0]; while(cx < s[1]-1e-6 && need.length){ const q=need[0]; const take=Math.min(q[1], s[1]-cx); out[q[0]].push({x:cx,y:0,w:take,h:fd}); cx+=take; q[1]-=take; if(q[1]<=1e-6) need.shift(); } }
    }
    const y0 = fd;
    // jalan utama
    out.roads.push({x:sx,y:0,w:mainW,h:D,kind:'utama'});
    // panjang segmen deret
    const segs = spine==='tengah'? [[0,sx],[sx+mainW,W]] : [[mainW,W]];
    // blok berulang ke arah y
    const shares = types.map(t=>Math.max(0,+t.share||0)); const sumShare = shares.reduce((a,b)=>a+b,0)||1;
    const made = types.map(()=>0);
    let y = y0, guard=0;
    while(guard++<500){
      // jalan lingkungan
      if(y+lw > D) break;
      out.roads.push({x:0,y,w:W,h:lw,kind:'lingkungan'}); y+=lw;
      // pilih tipe dengan kekurangan terbesar terhadap porsinya
      const totalMade = made.reduce((a,b)=>a+b,0)||0;
      let best=-1, bestGap=-Infinity;
      types.forEach((t,i)=>{ if(!(+t.lotW>0&&+t.lotD>0)||shares[i]<=0) return; const target=shares[i]/sumShare; const have=totalMade? made[i]/totalMade : 0; const gap=target-have; if(gap>bestGap){bestGap=gap;best=i} });
      if(best<0){ out.warn.push('Belum ada tipe rumah dengan ukuran kavling & porsi > 0.'); break; }
      const t=types[best], ld=+t.lotD, lwid=+t.lotW;
      const room = D - y;
      const rows = room >= 2*ld + lw ? 2 : (room >= 2*ld ? 2 : room >= ld ? 1 : 0);
      if(rows===0){ break; }
      const blk={y,h:rows*ld,type:best,rows};
      for(let r=0;r<rows;r++){
        const ry = y + r*ld;
        for(const s of segs){
          const L=s[1]-s[0], n=Math.floor((L+1e-6)/lwid);
          for(let k=0;k<n;k++) out.lots.push({x:s[0]+k*lwid,y:ry,w:lwid,h:ld,type:best,face:r===0?'atas':'bawah'});
          const rem = L - n*lwid; if(rem>0.01) out.sisa.push({x:s[0]+n*lwid,y:ry,w:rem,h:ld});

  function areaOf(arr){ return arr.reduce((a,r)=>a+r.w*r.h,0); }
  function finish(o,p){
    // luas jalan: jalan utama + jalan lingkungan − tumpang tindih
    const main=o.roads.filter(r=>r.kind==='utama'), loc=o.roads.filter(r=>r.kind==='lingkungan');
    let overlap=0; main.forEach(m=>loc.forEach(l=>{ const ox=Math.max(0,Math.min(m.x+m.w,l.x+l.w)-Math.max(m.x,l.x)), oy=Math.max(0,Math.min(m.y+m.h,l.y+l.h)-Math.max(m.y,l.y)); overlap+=ox*oy; }));
    // jalan utama yang melewati lajur depan tetap dihitung jalan
    // jalan utama di area blok: deret kavling tidak menempati jalur jalan utama, jadi luas = W×D kurang yang lain
    const aRoad = areaOf(main)+areaOf(loc)-overlap;
    const aLot = areaOf(o.lots), aRth=areaOf(o.rth), aFas=areaOf(o.fasum), aMak=areaOf(o.makam), aSisa=areaOf(o.sisa);
    const aPsu = aRoad+aRth+aFas+aMak+aSisa;
    o.area={road:aRoad,lot:aLot,rth:aRth,fasum:aFas,makam:aMak,sisa:aSisa,psu:aPsu,sum:aRoad+aLot+aRth+aFas+aMak+aSisa};
    o.units=o.lots.length;
    o.share={lot:aLot/o.A, psu:aPsu/o.A, road:aRoad/o.A, rth:(aRth+aSisa)/o.A, fasum:aFas/o.A, makam:aMak/o.A};
    o.density = o.units/(o.A/1e4);

    o.roadLen = main.reduce((a,r)=>a+r.h,0) + loc.reduce((a,r)=>a+r.w,0) - loc.length*main.reduce((a,r)=>a+r.w,0);

  }

  /* -------- Tipe rumah -------- */
  function house(t, rules){
    const LT=(+t.lotW)*(+t.lotD), floors=Math.max(1,+t.floors||1), LB=+t.LB, foot=LB/floors;
    const kdb = LT? foot/LT : NaN, klb = LT? LB/LT : NaN;
    const gsb=+rules.gsb||0, back=+rules.backSet||0;
    const maxDepth=(+t.lotD)-gsb-back, bw=Math.min(+t.lotW, foot/Math.max(1,Math.min(maxDepth,foot/Math.max(1,+t.lotW))));
    const bd = foot/Math.max(0.1, +t.lotW); // rumah deret/kopel: lebar bangunan = lebar kavling
    const fitDepth = bd <= maxDepth+1e-6;
    const kdh = LT? Math.max(0, (LT - foot - (+t.lotW)*Math.min(gsb, +rules.paveFront||0))/LT) : NaN;
    return {LT,LB,foot,floors,kdb,klb,kdh,bw:+t.lotW,bd,maxDepth,fitDepth};

  /* -------- Biaya, pendapatan, arus kas -------- */
  function feasibility(P, lay, styleFactor){
    const s=P.site, c=P.cost, sale=P.sales, fin=P.fin, T=P.types;
    const units = T.map((t,i)=>lay.lots.filter(l=>l.type===i).length);
    const nU = units.reduce((a,b)=>a+b,0);
    const revenueByType = T.map((t,i)=>units[i]*(+t.price||0));
    const revenue = revenueByType.reduce((a,b)=>a+b,0);
    const land = lay.A*(+s.landPrice||0)*(1+(+c.landTxPct||0)/100);
    const prep = lay.A*(+c.prepM2||0);
    const roads = lay.area.road*(+c.roadM2||0);
    const drain = Math.max(0,lay.roadLen)*2*(+c.drainM||0);
    const rth = (lay.area.rth+lay.area.sisa)*(+c.rthM2||0);

    const util = nU*(+c.utilUnit||0);

    const consByType = T.map((t,i)=>units[i]*(+t.LB||0)*(+c.buildM2||0)*(styleFactor(t)||1));
    const cons = consByType.reduce((a,b)=>a+b,0);
    const permits = (+c.permitLump||0) + nU*(+c.certUnit||0);
    const contingency = (infra+cons)*(+c.contPct||0)/100;
    const marketing = revenue*(+c.mktPct||0)/100;
    const taxRate = (P.rules.simple? 1:2.5)/100;
    const tax = revenue*taxRate;
    const overhead = (land+infra+cons+permits)*(+c.ohPct||0)/100;
    const total = land+infra+cons+permits+contingency+marketing+tax+overhead;
    const profit = revenue-total;
    const items=[['Lahan (termasuk biaya peralihan)',land],['Pematangan lahan',prep],['Jalan',roads],['Saluran drainase',drain],['RTH & taman',rth],['Fasum & makam',fasum],['Utilitas (air, listrik) per unit',util],['Konstruksi rumah',cons],['Perizinan & sertifikat',permits],['Cadangan tak terduga',contingency],['Pemasaran',marketing],['PPh final penjualan ('+fmt(taxRate*100,1)+'%)',tax],['Manajemen & umum',overhead]];

    const H = Math.max(6, Math.round(+sale.horizon||48));
    const flow = new Array(H+1).fill(0), inflow=new Array(H+1).fill(0), outflow=new Array(H+1).fill(0);
    const add=(m,v)=>{ m=clamp(Math.round(m),0,H); if(v<0) outflow[m]+=-v; else inflow[m]+=v; flow[m]+=v; };
    add(0,-land); add(0,-(+c.permitLump||0));

    for(let m=1;m<=infraM;m++){ add(m,-(infra)/infraM); add(m,-(contingency*(infra/(infra+cons||1)))/infraM); }
    const start=Math.max(0,Math.round(+sale.start||3)), rate=Math.max(0.1,+sale.perMonth||5), build=Math.max(1,Math.round(+sale.buildMonths||4)), dp=(+sale.dpPct||0)/100;
    let left=units.slice(), sold=0, m=start, soldBy=[];
    const avgPrice = nU? revenue/nU : 0;
    while(sold<nU && m<=H){
      let q=Math.min(rate, nU-sold);
      // sebar per tipe sebanding sisa unit
      const remTot = left.reduce((a,b)=>a+b,0)||1; let rev=0, cst=0;
      T.forEach((t,i)=>{ const qi=q*left[i]/remTot; left[i]-=qi; rev+=qi*(+t.price||0); cst+=qi*(+t.LB||0)*(+c.buildM2||0)*(styleFactor(t)||1); });
      sold+=q; soldBy.push([m,q]);
      add(m, rev*dp); add(m, -rev*(+c.mktPct||0)/100);
      for(let b=1;b<=build;b++){ add(m+b-1, -(cst+cst*(+c.contPct||0)/100)/build); add(m+b-1, -(cst*(+c.ohPct||0)/100)/build); }
      add(m+build, rev*(1-dp)); add(m+build, -rev*taxRate); add(m+build, -(+c.certUnit||0)*q);

    const ohBase=(land+infra+(+c.permitLump||0))*(+c.ohPct||0)/100; for(let k=1;k<=infraM;k++) add(k,-ohBase/infraM);
    const sellMonths = nU? Math.ceil(nU/rate) : 0;
    // pembiayaan pengembang
    const loanCap = total*(+fin.loanPct||0)/100, iLoan=(+fin.loanRate||0)/100/12, sweep=(+fin.sweepPct||100)/100;
    let debt=0, cash=0, peakDebt=0, totInt=0, equity=0; const eqFlow=new Array(H+1).fill(0), debtBy=[];
    for(let t=0;t<=H;t++){
      let cf=flow[t];
      const int=debt*iLoan; totInt+=int; cf-=int;
      if(cf<0){ const draw=Math.min(-cf, Math.max(0,loanCap-debt)); debt+=draw; cf+=draw; if(cf<0){ equity+=-cf; eqFlow[t]+=cf; cf=0; } }
      else { const pay=Math.min(debt, cf*sweep); debt-=pay; cf-=pay; eqFlow[t]+=cf; }

    let cum=0, peakNeg=0, payback=null; flow.forEach((v,t)=>{ cum+=v; peakNeg=Math.min(peakNeg,cum); if(payback===null && t>0 && cum>=0 && flow.slice(0,t).some(x=>x<0)) payback=t; });

      land,infra,cons,permits,contingency,marketing,tax,overhead,
      flow,inflow,outflow,H,sellMonths,soldBy,avgPrice,
      npv:npv(flow,disc), irr:irr(flow), peakFunding:-peakNeg, payback,
      loan:{cap:loanCap,peakDebt,totInt,equity,eqIrr:irr(eqFlow),eqFlow,debtBy, profitAfter: profit-totInt},
      costPerUnit: nU? total/nU : NaN};
  }

  return {annuity,kpr,npv,irr,irrMonthly,layout,house,feasibility,areaOf};
})();

let saveT=0; function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem('rp.project',JSON.stringify(P)); }catch(e){} },300); }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2200); }
/* konfirmasi dua klik (tanpa confirm/alert) */
function confirmArm(btn, fn, label){ if(btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent=btn.dataset.lbl; fn(); return; } btn.dataset.lbl=btn.textContent; btn.dataset.armed=1; btn.classList.add('armed'); btn.textContent=label||'Klik lagi untuk yakin'; setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent=btn.dataset.lbl; } },3500); }

const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{ const ks=p.split('.'); let a=o; for(let i=0;i<ks.length-1;i++) a=a[ks[i]]; a[ks[ks.length-1]]=v; };
const styleFactor = t => (t.sf!=null && t.sf!=='' && isFinite(+t.sf))? +t.sf : (STYLES[t.style]||STYLES.minimalis).f;
function calc(){ const lay=RP.layout(Object.assign({},P.site,P.plan),P.types); const fe=RP.feasibility(P,lay,styleFactor); return {lay,fe}; }

/* ---------- Komponen formulir ---------- */
function F(path,label,unit,opt={}){
  const v=getPath(P,path);
  if(opt.sel) return `<label class="f">${label}<select data-k="${path}" ${opt.num?'data-num="1"':''}>${opt.sel.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>${unit?`<span class="u">${unit}</span>`:''}</label>`;
  if(opt.chk) return `<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-k="${path}" ${v?'checked':''}> ${label}</label>`;
  return `<label class="f">${label}<input type="number" step="${opt.step||'any'}" min="${opt.min??0}" data-k="${path}" value="${v==null?'':esc(v)}">${unit?`<span class="u">${unit}</span>`:''}</label>`;
}
function bindInputs(root, after){
  $$('[data-k]',root).forEach(el=>{
    const ev = el.tagName==='SELECT'||el.type==='checkbox'?'change':'input';
    el.addEventListener(ev,()=>{
      const p=el.dataset.k; let v = el.type==='checkbox'? el.checked : el.value;
      if(el.type==='number' || el.dataset.num) v = v===''? '' : +v;
      setPath(P,p,v); persist(); after&&after();
    });
  });
}

const TYPE_COLORS=['var(--lot)','var(--lot2)','var(--lot3)','var(--lot4)','var(--lot)','var(--lot2)'];
function sitePlanSVG(lay, opt={}){
  const W=lay.W, D=lay.D; if(!(W>0&&D>0)) return '<p class="note">Isi ukuran lahan.</p>';
  const pad=Math.max(W,D)*0.04, vw=W+pad*2, vh=D+pad*2+Math.max(W,D)*0.05;
  const s=(r,fill,extra='')=>`<rect x="${(r.x+pad).toFixed(2)}" y="${(r.y+pad).toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}" fill="${fill}" ${extra}/>`;
  const lw=Math.max(W,D)/600;
  let g=`<svg viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="Rencana tapak">`;
  g+=`<rect x="${pad}" y="${pad}" width="${W}" height="${D}" fill="var(--sheet)" stroke="var(--ink)" stroke-width="${lw*3}"/>`;
  lay.rth.forEach(r=>g+=s(r,'var(--rth)'));
  lay.sisa.forEach(r=>g+=s(r,'var(--sisa)'));
  lay.fasum.forEach(r=>g+=s(r,'var(--fasum)'));
  lay.makam.forEach(r=>g+=s(r,'var(--makam)'));
  lay.roads.forEach(r=>g+=s(r,'var(--road)'));
  // marka jalan
  lay.roads.forEach(r=>{ const hz=r.w>r.h; const x1=r.x+pad+(hz?0:r.w/2), y1=r.y+pad+(hz?r.h/2:0), x2=hz?x1+r.w:x1, y2=hz?y1:y1+r.h; g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--road-line)" stroke-width="${lw*1.5}" stroke-dasharray="${lw*8} ${lw*6}"/>`; });
  lay.lots.forEach((l,i)=>{ g+=s(l,TYPE_COLORS[l.type%TYPE_COLORS.length],`stroke="var(--ink)" stroke-opacity=".55" stroke-width="${lw}"`);
    // tapak bangunan (indikatif) di sisi muka jalan
    const t=P.types[l.type]; if(t){ const foot=(+t.LB)/Math.max(1,+t.floors), bd=Math.min(l.h-(+P.rules.gsb)-0.5, foot/l.w), gsb=+P.rules.gsb; if(bd>0){ const by = l.face==='atas'? l.y+gsb : l.y+l.h-gsb-bd; g+=`<rect x="${(l.x+pad+0.4).toFixed(2)}" y="${(by+pad).toFixed(2)}" width="${(l.w-0.8).toFixed(2)}" height="${bd.toFixed(2)}" fill="var(--wall)" stroke="var(--ink)" stroke-opacity=".35" stroke-width="${lw}"/>`; } } });
  if(opt.numbers && lay.lots.length<=400) lay.lots.forEach((l,i)=>{ g+=`<text x="${(l.x+pad+l.w/2).toFixed(2)}" y="${(l.y+pad+l.h/2+1).toFixed(2)}" font-size="${Math.min(l.w,l.h)*0.3}" text-anchor="middle" fill="var(--ink)" opacity=".75">${i+1}</text>`; });
  // label zona depan
  const lbl=(arr,t)=>arr.forEach(r=>{ if(r.w>W*0.06&&r.h>D*0.02) g+=`<text x="${r.x+pad+r.w/2}" y="${r.y+pad+r.h/2}" font-size="${Math.min(r.h*0.35,W*0.025)}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)">${t}</text>`; });
  lbl(lay.rth,'RTH'); lbl(lay.fasum,'Fasum'); lbl(lay.makam,'Makam');
  // pintu masuk & skala
  const sx=lay.roads[0]? lay.roads[0].x+lay.roads[0].w/2+pad : pad;
  g+=`<path d="M${sx} ${pad-pad*0.15} l${-pad*0.35} ${-pad*0.55} h${pad*0.7} z" fill="var(--warm)"/><text x="${sx+pad*0.5}" y="${pad*0.55}" font-size="${pad*0.45}" fill="var(--warm)">masuk</text>`;
  const sb = W>200?50:W>80?20:10; const by=D+pad*1.6;
  g+=`<rect x="${pad}" y="${by}" width="${sb}" height="${pad*0.18}" fill="var(--ink)"/><text x="${pad+sb+pad*0.2}" y="${by+pad*0.2}" font-size="${pad*0.45}" fill="var(--ink)">${sb} m</text>`;
  g+=`<text x="${pad+W}" y="${by+pad*0.2}" font-size="${pad*0.45}" text-anchor="end" fill="var(--muted)">${fmt(W)} × ${fmt(D)} m · ${fmt(lay.units)} kavling</text>`;
  return g+'</svg>';
}

/* Denah skematik satu lantai (rumah deret/kopel; lebar bangunan = lebar kavling) */
function floorPlan(t){
  const R=P.rules, w=+t.lotW, d=+t.lotD, floors=Math.max(1,+t.floors||1), foot=(+t.LB)/floors, gsb=+R.gsb, back=+R.backSet;
  const bd=Math.max(3,Math.min(d-gsb-0.5, foot/w)), beds=Math.max(1,+t.beds||1), baths=Math.max(1,+t.baths||1);
  const rooms=[]; const R1=(n,x,y,ww,hh,c)=>rooms.push({n,x,y,w:ww,h:hh,c});
  // lantai 1: depan→belakang
  const y0=gsb, x0=0, teras=Math.min(1.5,bd*0.15);
  const bedsDown = floors>1? Math.max(0,beds-2) : beds, bathsDown= floors>1? 1 : baths;
  const colL = bedsDown>0? Math.max(2.6, w*0.48) : w;
  R1('Teras',x0,y0,w,teras,'var(--paper)');
  const yR=y0+teras, hR=bd-teras;
  if(bedsDown>0){
    const kt=Math.min(3.2,hR/Math.max(1,bedsDown+0.6));
    for(let i=0;i<bedsDown;i++) R1(i===0?'KT utama':'KT '+(i+1), colL, yR+i*kt, w-colL, kt, 'var(--accent-soft)');
    const used=bedsDown*kt, kmH=Math.min(1.8, hR-used);
    if(kmH>0.8) R1('KM',colL,yR+used,w-colL,kmH,'var(--lot4)');
    const lvH=hR*0.62; R1(floors>1?'R. keluarga + tangga':'R. tamu & keluarga',x0,yR,colL,lvH,'var(--warm-soft)');
    R1('Dapur & makan',x0,yR+lvH,colL,hR-lvH,'var(--lot)');
    if(kmH<=0.8) R1('KM',x0+colL*0.6,yR+lvH,colL*0.4,hR-lvH,'var(--lot4)');
  } else {
    const lvH=hR*0.6; R1('R. keluarga + tangga',x0,yR,w,lvH,'var(--warm-soft)'); R1('Dapur & makan',x0,yR+lvH,w*0.65,hR-lvH,'var(--lot)'); R1('KM',x0+w*0.65,yR+lvH,w*0.35,hR-lvH,'var(--lot4)');
  }
  const carport = gsb>=2.5;
  return {w,d,bd,gsb,back,rooms,carport,upBeds: floors>1? Math.min(beds,2):0, upBaths: floors>1? Math.max(1,baths-bathsDown):0};
}
function floorPlanSVG(t){
  const fp=floorPlan(t), pad=1.2, vw=fp.w+pad*2+3.2, vh=fp.d+pad*2;
  let g=`<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Denah skematik">`;
  g+=`<rect x="${pad}" y="${pad}" width="${fp.w}" height="${fp.d}" fill="var(--rth)" opacity=".35" stroke="var(--muted)" stroke-width=".05" stroke-dasharray=".25 .2"/>`;
  if(fp.carport) g+=`<rect x="${pad+0.2}" y="${pad+0.2}" width="${Math.min(3,fp.w-0.4)}" height="${fp.gsb-0.4}" fill="var(--road)" opacity=".5"/><text x="${pad+0.2+Math.min(3,fp.w-0.4)/2}" y="${pad+fp.gsb/2}" font-size=".42" text-anchor="middle" fill="var(--ink)">Carport</text>`;
  fp.rooms.forEach(r=>{ g+=`<rect x="${(pad+r.x).toFixed(2)}" y="${(pad+r.y).toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}" fill="${r.c}" stroke="var(--ink)" stroke-width=".1"/>`;
    const fs=Math.min(.42, (r.w-0.2)/(r.n.length*0.56), r.h/2.4); g+=`<text x="${(pad+r.x+r.w/2).toFixed(2)}" y="${(pad+r.y+r.h/2).toFixed(2)}" font-size="${fs.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)">${esc(r.n)}</text>`;
    if(r.w>1.6&&r.h>1.2) g+=`<text x="${(pad+r.x+r.w/2).toFixed(2)}" y="${(pad+r.y+r.h/2+fs*1.2).toFixed(2)}" font-size="${(fs*.75).toFixed(2)}" text-anchor="middle" fill="var(--muted)">${fmt(r.w*r.h,1)} m²</text>`; });
  g+=`<rect x="${pad}" y="${pad+fp.gsb}" width="${fp.w}" height="${fp.bd}" fill="none" stroke="var(--ink)" stroke-width=".22"/>`;
  // dimensi
  g+=`<text x="${pad+fp.w/2}" y="${pad-0.35}" font-size=".45" text-anchor="middle" fill="var(--muted)">${fmt(fp.w,1)} m</text>`;
  g+=`<text x="${pad+fp.w+0.3}" y="${pad+fp.d/2}" font-size=".45" fill="var(--muted)">${fmt(fp.d,1)} m</text>`;
  g+=`<text x="${pad+fp.w+0.3}" y="${pad+fp.gsb/2}" font-size=".38" fill="var(--muted)">GSB ${fmt(fp.gsb,1)}</text>`;
  g+=`<text x="${pad+fp.w+0.3}" y="${pad+0.45}" font-size=".4" fill="var(--warm)">← jalan</text>`;
  return g+'</svg>';
}

/* Tampak isometrik prosedural per gaya */
function isoSVG(t, opt={}){
  const st=STYLES[t.style]||STYLES.minimalis, floors=Math.max(1,+t.floors||1), w=Math.max(3,+t.lotW||6), d=Math.max(4,Math.min(((+t.LB||36)/floors)/w, (+t.lotD||12)-(+P.rules.gsb||0)-0.5)), H=3.2*floors;
  const k=opt.small? 6 : 10, c30=Math.cos(Math.PI/6), s30=0.5;
  const pts=[]; const P3=(x,y,z)=>[(x-y)*c30*k, (x+y)*s30*k - z*k];
  const poly=(arr,fill,stroke='rgba(0,0,0,.35)',sw=.6)=>`<polygon points="${arr.map(p=>{const q=P3(...p);pts.push(q);return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  // bangunan: x 0..w (lebar muka), y 0..d (kedalaman), muka menghadap +y
  let g='';
  // tanah & bayangan
  g+=poly([[-1.5,-1,0],[w+1.5,-1,0],[w+1.5,d+3.2,0],[-1.5,d+3.2,0]],'var(--rth)','none');
  g+=poly([[0,d,0],[w,d,0],[w,d+3,0],[0,d+3,0]],'var(--road)','none');
  // kaki batu
  g+=poly([[w,0,0],[w,d,0],[w,d,0.45],[w,0,0.45]],st.base); g+=poly([[0,d,0],[w,d,0],[w,d,0.45],[0,d,0.45]],st.base);
  // sisi kanan & muka
  g+=poly([[w,0,0.45],[w,d,0.45],[w,d,H],[w,0,H]],shade(st.wall,-0.12));
  g+=poly([[0,d,0.45],[w,d,0.45],[w,d,H],[0,d,H]],st.wall);
  // aksen fasad per gaya
  const face=(x0,z0,x1,z1,fill,sw=.4)=>poly([[x0,d+0.01,z0],[x1,d+0.01,z0],[x1,d+0.01,z1],[x0,d+0.01,z1]],fill,'rgba(0,0,0,.4)',sw);
  if(st.roof==='frame'){ g+=face(-0.2,0.45,w*0.58,H+0.15,st.accent,.6); }
  if(t.style==='tropis'||t.style==='japandi'){ const x0=w*0.62, x1=w-0.25; const n=Math.max(4,Math.round((x1-x0)/0.18)); for(let i=0;i<n;i++){ const xa=x0+i*(x1-x0)/n; g+=face(xa,0.6,xa+(x1-x0)/n*0.55,H-0.3,st.accent,.2); } }
  if(t.style==='industrial'){ for(let z=0.6;z<H-0.2;z+=0.32) g+=face(0,z,w,z+0.04,shade(st.wall,-0.2),.1); }
  if(t.style==='minimalis'){ g+=face(w*0.04,0.45,w*0.3,H-0.2,st.accent,.4); }
  if(t.style==='nusantara'){ g+=face(0.15,0.45,w-0.15,0.95,shade(st.base,0.08),.3); }
  // pintu & jendela tiap lantai
  for(let f=0;f<floors;f++){
    const zb=f*3.2+0.45;
    if(f===0){ g+=face(w*0.36,zb,w*0.36+0.95,zb+2.15,st.trim,.4); g+=face(w*0.36+0.08,zb+0.08,w*0.36+0.87,zb+2.05,shade(st.accent,-0.15),.2); }
    const win=(xa,xb)=>{ g+=face(xa,zb+0.9,xb,zb+2.25,st.trim,.4); g+=face(xa+0.07,zb+0.97,xb-0.07,zb+2.18,'rgba(140,180,200,.85)',.15); };
    if(f===0){ win(w*0.58,Math.min(w-0.3,w*0.58+1.6)); }
    else { win(w*0.12,w*0.12+1.4); win(w*0.55,Math.min(w-0.3,w*0.55+1.8)); g+=face(0.3,zb-0.05,w-0.3,zb+0.08,st.trim,.2); }
  }
  // jendela sisi
  for(let f=0;f<floors;f++){ const zb=f*3.2+0.45; g+=poly([[w+0.01,d*0.35,zb+1],[w+0.01,d*0.55,zb+1],[w+0.01,d*0.55,zb+2.1],[w+0.01,d*0.35,zb+2.1]],'rgba(120,160,180,.8)','rgba(0,0,0,.4)',.4); }
  // atap
  const R=st.roofC, ov= (st.roof==='hip'||st.roof==='gable-low')?0.7: st.roof==='gable-tall'?0.5:0.25;
  if(st.roof==='flat'||st.roof==='frame'){
    g+=poly([[-0.05,-0.05,H],[w+0.05,-0.05,H],[w+0.05,d+0.05,H],[-0.05,d+0.05,H]],shade(R,0.15));
    g+=poly([[w+0.05,-0.05,H],[w+0.05,d+0.05,H],[w+0.05,d+0.05,H+0.55],[w+0.05,-0.05,H+0.55]],shade(st.wall,-0.1));
    g+=poly([[-0.05,d+0.05,H],[w+0.05,d+0.05,H],[w+0.05,d+0.05,H+0.55],[-0.05,d+0.05,H+0.55]],st.wall);
    if(st.roof==='frame'){ g+=poly([[w*0.15,d,H*0.33],[w*0.15,d+1.6,H*0.33],[w*0.9,d+1.6,H*0.33],[w*0.9,d,H*0.33]],'rgba(170,200,215,.55)'); }
  } else if(st.roof==='shed'){
    const hh=1.3; g+=poly([[-ov,-ov,H+hh],[w+ov,-ov,H+hh],[w+ov,d+ov,H],[-ov,d+ov,H]],R);
    g+=poly([[w,0,H],[w,0,H+hh],[w,d,H]],shade(st.wall,-0.12));
  } else if(st.roof==='hip'){
    const rh=1.5; g+=poly([[w+ov,-ov,H],[w+ov,d+ov,H],[w*0.5,d*0.65,H+rh],[w*0.5,d*0.35,H+rh]],shade(R,-0.1));
    g+=poly([[-ov,d+ov,H],[w+ov,d+ov,H],[w*0.5,d*0.65,H+rh]],R);
  } else { // pelana: bubungan sejajar kedalaman (y), gevel menghadap jalan
    const rh = st.roof==='gable-steep'? w*0.62 : st.roof==='gable-tall'? w*0.75 : w*0.3;
    g+=poly([[w*0.5,-ov,H+rh],[w*0.5,d+ov,H+rh],[w+ov,d+ov,H-0.15],[w+ov,-ov,H-0.15]],shade(R,-0.1));
    g+=poly([[0,d,H],[w,d,H],[w*0.5,d,H+rh]],st.roof==='gable-steep'? st.wall : shade(st.wall,0.02));
    g+=poly([[-ov,d+ov,H-0.15],[w*0.5,d+ov,H+rh],[w*0.5,d+ov-0.12,H+rh],[-ov,d+ov-0.12,H-0.15]],shade(R,0.1));
    g+=poly([[w*0.5,d+ov,H+rh],[w+ov,d+ov,H-0.15],[w+ov,d+ov-0.12,H-0.15],[w*0.5,d+ov-0.12,H+rh]],shade(R,0.05));
    if(st.roof==='gable-tall'){ for(let i=0;i<5;i++) g+=poly([[w*0.5-0.6+i*0.26,d+0.02,H+rh*0.35],[w*0.5-0.48+i*0.26,d+0.02,H+rh*0.35],[w*0.5-0.48+i*0.26,d+0.02,H+rh*0.55],[w*0.5-0.6+i*0.26,d+0.02,H+rh*0.55]],shade(st.accent,0.1),'rgba(0,0,0,.4)',.2); }
  }
  // pohon kecil
  const tr=(x,y)=>{ const q=P3(x,y,0), r=1.1*k; pts.push([q[0]-r,q[1]-2.6*k]); return `<rect x="${q[0]-0.06*k}" y="${q[1]-1.4*k}" width="${0.12*k}" height="${1.4*k}" fill="#6b4f35"/><circle cx="${q[0]}" cy="${q[1]-1.9*k}" r="${0.75*k}" fill="#5f9a52" opacity=".9"/>`; };
  g+=tr(-0.9,d+1.2);
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const minx=Math.min(...xs)-6, miny=Math.min(...ys)-6, maxx=Math.max(...xs)+6, maxy=Math.max(...ys)+6;
  return `<svg viewBox="${minx.toFixed(1)} ${miny.toFixed(1)} ${(maxx-minx).toFixed(1)} ${(maxy-miny).toFixed(1)}" role="img" aria-label="Tampak ${esc(st.n)}">${g}</svg>`;
}
function shade(hex,amt){ if(!/^#[0-9a-f]{6}$/i.test(hex)) return hex; const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const f=v=>clamp(Math.round(amt<0? v*(1+amt) : v+(255-v)*amt),0,255); return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); }

/* Grafik arus kas kumulatif (garis) + batang bulanan */
function cashSVG(fe){
  const fl=fe.flow, n=fl.length; let cum=0; const cu=fl.map(v=>cum+=v);
  const mx=Math.max(1,...fl.map(Math.abs),...cu.map(Math.abs)), w=760, h=230, pl=64, pb=24, pt=10, iw=w-pl-10, ih=h-pb-pt, x=i=>pl+i*iw/Math.max(1,n-1), y=v=>pt+ih/2-v/mx*ih/2;
  let g=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Arus kas"><line x1="${pl}" x2="${w-10}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  fl.forEach((v,i)=>{ const bw=Math.max(1,iw/n*0.7); g+=`<rect x="${x(i)-bw/2}" y="${Math.min(y(0),y(v))}" width="${bw}" height="${Math.abs(y(v)-y(0))}" fill="${v<0?'var(--warm)':'var(--accent)'}" opacity=".55"/>`; });
  g+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${cu.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
  [mx,mx/2,0,-mx/2,-mx].forEach(v=>g+=`<text x="${pl-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${rp(v)}</text>`);
  for(let i=0;i<n;i+=Math.max(1,Math.round(n/12))) g+=`<text x="${x(i)}" y="${h-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${i}</text>`;
  return g+'</svg>';
}
function donut(parts){ // [[label,value,color]]
  const tot=parts.reduce((a,p)=>a+p[1],0)||1, R=60, r=36, cx=70, cy=70; let a0=-Math.PI/2, g=`<svg viewBox="0 0 300 140" role="img" aria-label="Komposisi lahan">`;
  parts.forEach(p=>{ const a1=a0+2*Math.PI*p[1]/tot; if(p[1]<=0){return} const large=a1-a0>Math.PI?1:0, P=(rr,a)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)]; const [x0,y0]=P(R,a0),[x1,y1]=P(R,a1),[x2,y2]=P(r,a1),[x3,y3]=P(r,a0);
    g+= (p[1]>=tot-1e-9)? `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${p[2]}" stroke-width="${R-r}"/>` : `<path d="M${x0} ${y0}A${R} ${R} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${large} 0 ${x3} ${y3}Z" fill="${p[2]}"/>`; a0=a1; });
  parts.forEach((p,i)=>g+=`<rect x="160" y="${14+i*20}" width="11" height="11" rx="2" fill="${p[2]}"/><text x="177" y="${24+i*20}" font-size="12" fill="var(--ink)">${p[0]} ${pct(p[1]/tot)}</text>`);
  return g+'</svg>';
}

/* ---------- Tampak 3D realistis (three.js r171, MIT, di-vendor lokal — tanpa CDN) ----------
   Rumah prosedural dari ukuran tipe: material bertekstur (plester, bata, kayu, batu, genteng),
   bayangan matahari menurut jam, pantulan lingkungan, tetangga deret, jalan & saluran. */
let RP3D=null, rp3dP=null;
const V3={hour:9.5, nb:true, view:'34'};
function load3D(){
  if(rp3dP) return rp3dP;
  rp3dP=(async()=>{
    const src=id=>{ const e=document.getElementById(id); return e? e.textContent : ''; };
    const core=src('vx-three-core'), mod=src('vx-three'), env=src('vx-three-env');
    if(!core||!mod||!env) throw new Error('vendor three.js tidak ada');
    const url=s=>URL.createObjectURL(new Blob([s],{type:'text/javascript'}));
    const cu=url(core), mu=url(mod.split('./three.core.min.js').join(cu)), eu=url(env.replace(/from\s*['"]three['"]/g,`from '${mu}'`));
    const THREE=await import(mu), E=await import(eu);
    RP3D=make3D(THREE,E.RoomEnvironment); return RP3D;
  })();
  rp3dP.catch(()=>{});

      win(g,.35,top+.12,w-.7,rise-.3,0,1,st); strip(g,V(x0,yF+o2*s+.02,z1),V(x1,yF+o2*s+.02,z1),.22,TR); strip(g,V(x0,yB-o2*s+.02,z0),V(x1,yB-o2*s+.02,z0),.18,TR); return; }

  const FHof=fl=>3.2, PL3=.35;

  /* panggung (renderer + scene + cahaya) */
  function skyTex(){ const c=document.createElement('canvas'); c.width=4; c.height=256; const g=c.getContext('2d'), gr=g.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#5d93cc'); gr.addColorStop(.55,'#a8c8e4'); gr.addColorStop(1,'#e8eef0'); g.fillStyle=gr; g.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
  function stage(opt={}){ const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});

    const hemi=new THREE.HemisphereLight(0xdcebff,0x6d5d42,.85), sun=new THREE.DirectionalLight(0xfff1dc,3.2); sun.castShadow=true; sun.shadow.mapSize.set(opt.sm||2048,opt.sm||2048);
    Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:140}); sun.shadow.bias=-.0003; sun.shadow.normalBias=.03; scene.add(hemi,sun,sun.target);

  function clear(S){ S.world.traverse(m=>{ if(m.isMesh) m.geometry.dispose(); }); S.world.clear(); }
  function build(S,o){ clear(S); seed(JSON.stringify([o.st.n,o.fp.w,o.fp.bd,o.t.floors])); const fp=o.fp, w=fp.w, gsb=Math.max(.6,fp.gsb), nb=o.neighbors?(o.nb??2):0, L=(2*nb+1)*w+80, G=S.world;
    const gm=texMat('grass','',{roughness:.97,bumpScale:2}); const gr=box(G,L+60,.02,140,gm,-(L+60)/2,-.02,-90); gr.castShadow=false;
    for(let k=-nb;k<=nb;k++){ const h=house(o); h.position.x=k*w-w/2; G.add(h); }
    const lotBack=-(fp.d-gsb); box(G,(2*nb+1)*w,1.8,.12,wallMat({wallT:'plaster',wall:'#c9c5bd'}),-(2*nb+1)*w/2,0,lotBack-.12);
    box(G,L,.06,.5,flat('#9d9a93',.9),-L/2,0,gsb); box(G,L,.065,.26,flat('#26282a',.95),-L/2,0,gsb+.12);
    box(G,L,.04,6,texMat('asphalt','',{roughness:.95,bumpScale:1.5}),-L/2,0,gsb+.5); box(G,L,.16,.15,flat('#b3afa7',.85),-L/2,0,gsb+6.5);

    const pm=flat('#2a2c2e',.5,.6); for(let k=-nb;k<=nb;k+=2){ const x=k*w-w/2+.15; box(G,.08,4.2,.08,pm,x,0,gsb+.3); box(G,.6,.08,.16,pm,x,4.15,gsb+.3); }

const fmtHour=h=>String(Math.floor(h)).padStart(2,'0')+'.'+String(Math.round((h%1)*60)).padStart(2,'0');
async function downloadURL(u,name){ if(window.rpDesktop&&window.rpDesktop.saveImage){ const ok=await window.rpDesktop.saveImage({name,data:u}); if(ok) toast('Tersimpan: '+name); return; } const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

/* ---------- Berkas ---------- */
const slug=()=>String(P.title||'proyek').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'proyek';
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>{ const s=String(v==null?'':v); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n');
async function download(text,name,kind){ if(window.rpDesktop){ const ok=await window.rpDesktop.save({name,data:text,kind}); if(ok) toast('Tersimpan: '+name); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:kind==='csv'?'text/csv;charset=utf-8':'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function saveProject(){ P.title=$('#title').value; download(JSON.stringify(Object.assign({app:'rancang-perumahan',dibuat:'Pindo Tutuko'},P),null,1),slug()+'.json','json'); }
function openProject(text){ try{ const j=JSON.parse(text); if(j.v!==1||!j.site) throw 0; P=migrate(j); $('#title').value=P.title||''; persist(); render(cur); toast('Proyek dibuka'); }catch(e){ toast('Berkas proyek tidak dikenali'); } }

$('#bSave').onclick=saveProject;

$('#bPrint').onclick=printReport;
$('#bNew').onclick=e=>confirmArm(e.currentTarget,()=>{ P=defaultProject(); $('#title').value=P.title; persist(); selType=0; render('lahan'); toast('Proyek baru dengan nilai contoh'); },'Klik lagi: ganti proyek');
$('#title').value=P.title; $('#title').addEventListener('input',e=>{ P.title=e.target.value; persist(); });
