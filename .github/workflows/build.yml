name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/**']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node build-page.js
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: Build macOS dmg
        if: runner.os == 'macOS'
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Rancang-Perumahan-${{ runner.os }}
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    needs: [test, build]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Catatan rilis
        run: |
          V=${{ steps.v.outputs.version }}
          {
            echo "# Rancang Perumahan versi $V"
            echo
            echo "Aplikasi studi tapak, desain tipe rumah, kelayakan bisnis, dan KPR untuk arsitek dan pengembang (Windows dan Mac). Dibuat oleh Pindo Tutuko."
            echo
            echo "## Apa yang baru"
            awk -v v="## $V" 'index($0,v)==1{f=1;next} /^## [0-9]/{if(f)exit} f' CHANGELOG.md
          } > release-body.md
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Rancang Perumahan v${{ steps.v.outputs.version }}
          body_path: release-body.md
          files: out/*
